/* ---------- 分类 tabs ---------- */
function renderTabs(){
  var box = document.getElementById('tabs');
  box.innerHTML = '';
  var list = [{id:'recent', n:'最近使用'}].concat(DATA);
  list.forEach(function(d){
    var b = document.createElement('div');
    b.className = 'tab' + (CUR === d.id ? ' on' : '');
    b.textContent = d.n;
    b.onclick = function(){ CUR = d.id; renderTabs(); render(); window.scrollTo({top:0,behavior:'smooth'}); };
    box.appendChild(b);
  });
}

/* ---------- 渲染 ---------- */
function render(){
  var c = document.getElementById('content');
  var kw = document.getElementById('q').value.trim();
  c.innerHTML = '';

  if (kw){ renderSearch(kw, c); return; }

  if (CUR === 'recent'){
    if (!RECENT.length){
      c.innerHTML = '<div class="empty">还没有复制过符号<br>点任意符号后，这里会记录最近使用的</div>';
      return;
    }
    c.appendChild(section('最近使用', RECENT));
    return;
  }

  var cat = DATA.filter(function(d){ return d.id === CUR; })[0];
  if (cat) c.appendChild(section(cat.n + ' · ' + cat.s.length + ' 个', cat.s));
}

function section(title, syms){
  var s = document.createElement('div');
  s.className = 'sec';
  var h = document.createElement('h2');
  h.textContent = title;
  s.appendChild(h);
  var g = document.createElement('div');
  g.className = 'grid';
  syms.forEach(function(ch){ g.appendChild(cell(ch)); });
  s.appendChild(g);
  return s;
}

function cell(ch){
  var d = document.createElement('div');
  d.className = 'cell';
  d.textContent = ch;
  d.onclick = function(){ copy(ch, d); };
  return d;
}

function renderSearch(kw, c){
  var low = kw.toLowerCase();
  var hitCats = DATA.filter(function(d){
    return d.n.toLowerCase().indexOf(low) >= 0 || d.id.indexOf(low) >= 0;
  });
  var chars = [];
  DATA.forEach(function(d){
    d.s.forEach(function(ch){ if (ch === kw || (kw.length === 1 && ch === kw)) chars.push(ch); });
  });
  // 单字符精确匹配优先
  if (chars.length){
    c.appendChild(section('精确匹配', [chars[0]]));
  }
  var total = 0;
  hitCats.forEach(function(d){
    var sub = d.s.filter(function(ch){ return ch.indexOf(kw) >= 0; });
    if (!sub.length) sub = d.s;
    total += sub.length;
    c.appendChild(section(d.n + ' · ' + sub.length + ' 个', sub));
  });
  if (!hitCats.length){
    c.innerHTML = '<div class="empty">没找到「' + kw + '」相关的分类<br>试试搜「箭头」「星」「括号」「货币」</div>';
  }
}

function onSearch(){ render(); }

  var done = function(){
    if (el){ el.classList.add('ok'); setTimeout(function(){ el.classList.remove('ok'); }, 600); }
    toast('已复制 ' + ch);
    addRecent(ch);
  };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(ch).then(done, fb);
  } else fb();

  function fb(){
    var ta = document.createElement('textarea');
    ta.value = ch;
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); done(); }
    catch(e){ toast('复制失败，请长按符号复制'); }
    document.body.removeChild(ta);
  }
}

function addRecent(ch){
  RECENT = [ch].concat(RECENT.filter(function(x){ return x !== ch; })).slice(0, 24);
  try { localStorage.setItem('sym_recent', JSON.stringify(RECENT)); } catch(e){}
}

var toastTimer;
function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 1400);
}

/* ---------- 启动 ---------- */
renderTabs();
render();
</script>
</body>
</html>
